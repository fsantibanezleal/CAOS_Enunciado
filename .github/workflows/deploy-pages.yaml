name: deploy-pages

# Publishes the built SPA plus the COMMITTED artifacts. It never bakes, never solves and never
# calls a model: the numbers it serves were produced by a local run and committed, so a deploy
# cannot quietly change a published figure.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the committed artifacts before building anything
        # Stdlib only, and it runs FIRST: publishing a site whose artifacts are missing or
        # inconsistent would put a broken page in front of readers, and the build would not notice.
        run: python scripts/check_artifacts.py

      - name: Install
        working-directory: frontend
        # The web build must never drag in a native ML runtime. onnxruntime-node downloads native
        # and CUDA binaries at install time, which is a training-stack install by another name.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      - name: Copy the committed artifacts into the site
        working-directory: frontend
        run: npm run copy-data

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: SPA deep links
        # A static host answers an unknown path with 404.html. Copying index.html there is what
        # makes /methodology work on a refresh instead of returning a 404 that the SPA never sees.
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
