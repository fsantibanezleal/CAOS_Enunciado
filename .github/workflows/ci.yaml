name: ci

# Triggers are trunk plus manual only. No pull_request trigger, no schedule, no feature branches:
# the Actions quota on this account was exhausted once by workflows that ran on everything.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the cheap checks only
        # This is a PRODUCT. Its test suite needs a solver and its bake solves twenty models, so
        # neither runs here: both run locally and their output is committed. CI installs a linter
        # and nothing else.
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        # `scripts/` runs in this very workflow and was not linted: two real findings sat
        # there for as long as it has existed.
        run: python -m ruff check data-pipeline scripts tests

      - name: A file with a shebang is executable
        # Windows commits a tracked file as mode 100644 whatever its content says, so a script with
        # a shebang arrives on Linux unexecutable and the command a README prints fails with
        # "Permission denied". This repo is authored on Windows, so the check is not optional.
        run: |
          set -euo pipefail
          bad=""
          for f in $(git ls-files '*.py' '*.sh' '*.mjs'); do
            if head -1 "$f" | grep -q '^#!'; then
              mode=$(git ls-files -s "$f" | cut -d' ' -f1)
              [ "$mode" = "100755" ] || bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then
            echo "these carry a shebang and are not executable:$bad"
            echo "fix with: git update-index --chmod=+x$bad"
            exit 1
          fi
          echo "every shebang file is executable"

      - name: The SDD gate, every requirement names its verification
        run: python scripts/check_sdd.py

      - name: The committed artifacts are present and readable
        # Stdlib only. It checks that the bake was run and committed; it does NOT re-run the bake.
        run: python scripts/check_artifacts.py

      - name: The published report agrees with the run ledger
        # A pure re-derivation: it reads two committed files and compares, so it costs a second and
        # calls no model. The first version of the report was assembled by hand from a printed
        # summary, and a hand-assembled artifact cannot be checked against the thing it summarises.
        run: |
          # PINNED, not floated. The report is a function of this code, so the check only means
          # something against the versions that produced the committed artifact. A newer copela
          # breaking this is the correct outcome: it says the artifact needs re-deriving.
          python -m pip install --quiet 'copela==0.2.0' 'planteo==0.1.0'
          PYTHONPATH=data-pipeline python data-pipeline/report.py --check
