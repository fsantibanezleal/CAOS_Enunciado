name: ci

# Triggers are trunk plus manual only. No pull_request trigger, no schedule, no feature branches:
# the Actions quota on this account was exhausted once by workflows that ran on everything.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the cheap checks only
        # This is a PRODUCT. Its test suite needs a solver and its bake solves twenty models, so
        # neither runs here: both run locally and their output is committed. CI installs a linter
        # and nothing else.
        run: python -m pip install --upgrade pip "ruff==0.16.9"

      - name: Lint
        # `scripts/` runs in this very workflow and was not linted: two real findings sat
        # there for as long as it has existed.
        run: python -m ruff check data-pipeline scripts tests

      - name: A file with a shebang is executable
        # Windows commits a tracked file as mode 100644 whatever its content says, so a script with
        # a shebang arrives on Linux unexecutable and the command a README prints fails with
        # "Permission denied". This repo is authored on Windows, so the check is not optional.
        run: |
          set -euo pipefail
          bad=""
          for f in $(git ls-files '*.py' '*.sh' '*.mjs'); do
            if head -1 "$f" | grep -q '^#!'; then
              mode=$(git ls-files -s "$f" | cut -d' ' -f1)
              [ "$mode" = "100755" ] || bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then
            echo "these carry a shebang and are not executable:$bad"
            echo "fix with: git update-index --chmod=+x$bad"
            exit 1
          fi
          echo "every shebang file is executable"

      - name: The SDD gate, every requirement names its verification
        run: python scripts/check_sdd.py

      - name: The docs wiki is present and its links resolve
        # ADR-0056 makes the wiki binding, and a binding thing with no check is a wish. This catches
        # the two ways documentation rots that a machine can see: a theme folder that lost its
        # landing page, and a link to a file that was renamed. Both look fine in a diff.
        run: python scripts/check_docs.py

      - name: The VERSION file and the version the site shows agree
        # They drifted the first time the product was versioned after release: VERSION said 0.02.000
        # and every page footer said 0.01.000. A version a reader can see is a claim about what they
        # are looking at, and a wrong one points bug reports at the wrong build.
        run: python scripts/check_version.py

      - name: The committed artifacts are present, readable, and agree with the ledger
        # Stdlib only. It checks that the bake was run and committed, and recomputes the two published
        # rates per model from the raw ledger with nothing but json. It does NOT re-run the bake or
        # the report: those are pipeline scripts, and they run locally (`run.ps1 check`).
        run: python scripts/check_artifacts.py

      - name: The manuscript prints the numbers of the committed artifacts
        # Stdlib only. `make_numbers.py --check` regenerates the macro file, the three table bodies
        # and the figure data into a scratch directory and compares them with the tracked ones. The
        # ledger had grown from 370 to 640 calls with the manuscript still printing 370, and nothing
        # said so until this step existed.
        run: python manuscripts/narrative-to-optimization/make_numbers.py --check

      - name: The CI budget guard (ADR-0074)
        # Copied from the template, where it is the enforcement of record. On its first run here it
        # failed this very workflow: the report re-derivation step ran `data-pipeline/report.py`,
        # which is a pipeline entry point, and installed two packages to do it. That step now runs
        # in the local check, and CI keeps only the stdlib consistency check above.
        run: python scripts/check_ci_budget.py

      - name: No em-dash and no emoji in product content (ADR-0067)
        # Its first run here found ten em-dashes, all of them the empty-value placeholder in tables.
        run: python scripts/check_content_standards.py

      - name: No control character where a backslash was lost
        # A heredoc drops one backslash level, so `\text` lands as a tab, `\bigl` as a backspace and
        # `.\run.ps1` as a carriage return. Two equations and every README run command shipped that
        # way, and the browser gate missed them because KaTeX renders a tab as a space.
        run: python scripts/check_control_chars.py
