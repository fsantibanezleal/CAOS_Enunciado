.dg-bar-label { fill: var(--color-fg-subtle); font: 11px var(--font-sans); }</style><rect x="8" y="8" width="684" height="228" rx="10" class="dg-box accent" opacity="0.35"></rect><text x="24" y="30" class="dg-box-title accent">planteo.Problem</text><text x="676" y="30" text-anchor="end" class="dg-box-sub">schema_version 1.0</text><g><rect x="24" y="44" width="652" height="26" rx="5" class="dg-box"></rect><text x="36" y="62" class="dg-box-title">quantities</text><text x="664" y="62" text-anchor="end" class="dg-box-sub">name, role, dimension, domain, bounds, span</text></g><g><rect x="24" y="75" width="652" height="26" rx="5" class="dg-box"></rect><text x="36" y="93" class="dg-box-title">relations</text><text x="664" y="93" text-anchor="end" class="dg-box-sub">compare / logical / forall, each with a span</text></g><g><rect x="24" y="106" width="652" height="26" rx="5" class="dg-box"></rect><text x="36" y="124" class="dg-box-title">objectives</text><text x="664" y="124" text-anchor="end" class="dg-box-sub">sense + expression</text></g><g><rect x="24" y="137" width="652" height="26" rx="5" class="dg-box"></rect><text x="36" y="155" class="dg-box-title">assumptions</text><text x="664" y="155" text-anchor="end" class="dg-box-sub">what was assumed, and from where</text></g><g><rect x="24" y="168" width="652" height="26" rx="5" class="dg-box"></rect><text x="36" y="186" class="dg-box-title">open_questions</text><text x="664" y="186" text-anchor="end" class="dg-box-sub">what the text did NOT determine</text></g><g><rect x="24" y="199" width="652" height="26" rx="5" class="dg-box"></rect><text x="36" y="217" class="dg-box-title">narrative</text><text x="664" y="217" text-anchor="end" class="dg-box-sub">text, language, digest</text></g><text x="350" y="258" text-anchor="middle" class="dg-note">open_questions is what separates this document from any JSON schema: it records what the statement left undecided.</text><text x="350" y="274" text-anchor="middle" class="dg-note">A formalizer that never opens a question is guessing silently.</text></svg>
