<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" class="fig-svg wide" viewBox="0 0 700 280" role="img" aria-label="The intermediate representation"><style>svg { --color-bg: #f6f8fa; --color-surface: #ffffff; --color-surface-2: #f0f3f6; --color-border: #d0d7de; --color-fg: #1f2328; --color-fg-subtle: #57606a; --color-fg-faint: #6e7781; --color-accent: #0969da; --color-accent-fg: #ffffff; --color-accent-soft: #ddf4ff; --color-accent-2: #0a7c8a; --color-magenta: #bf3989; --color-good: #1a7f37; --color-warn: #9a6700; --color-bad: #cf222e; --color-shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 10px rgba(31, 35, 40, 0.04); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-family: var(--font-sans); }
