<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" class="fig-svg wide" viewBox="0 0 760 340" role="img" aria-label="Colour refinement on a model&#x27;s graph"><style>svg { --color-bg: #f6f8fa; --color-surface: #ffffff; --color-surface-2: #f0f3f6; --color-border: #d0d7de; --color-fg: #1f2328; --color-fg-subtle: #57606a; --color-fg-faint: #6e7781; --color-accent: #0969da; --color-accent-fg: #ffffff; --color-accent-soft: #ddf4ff; --color-accent-2: #0a7c8a; --color-magenta: #bf3989; --color-good: #1a7f37; --color-warn: #9a6700; --color-bad: #cf222e; --color-shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 10px rgba(31, 35, 40, 0.04); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-family: var(--font-sans); }
@media (prefers-color-scheme: dark) { svg { --color-bg: #0d1117; --color-surface: #161b22; --color-surface-2: #1c2230; --color-border: #30363d; --color-fg: #c9d1d9; --color-fg-subtle: #9aa6b2; --color-fg-faint: #6c7785; --color-accent: #58a6ff; --color-accent-fg: #0d1117; --color-accent-soft: #132036; --color-accent-2: #3fb1c8; --color-magenta: #f778ba; --color-good: #3fb950; --color-warn: #d29922; --color-bad: #f85149; --color-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.45); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; } }
.dg-axis { stroke: var(--color-fg-faint); stroke-width: 1.3; }
.dg-axis-label { fill: var(--color-fg-subtle); font: 12px var(--font-sans); }
.dg-tick { fill: var(--color-fg-faint); font: 11px var(--font-mono); }
.dg-grid { stroke: var(--color-border); stroke-width: 0.5; opacity: 0.6; }
.dg-curve { fill: none; stroke: var(--color-accent); stroke-width: 2.2; stroke-linejoin: round; }
.dg-curve-2 { fill: none; stroke: var(--color-magenta); stroke-width: 2; }
.dg-curve-faint { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.4; stroke-dasharray: 4 3; }
.dg-asymptote { stroke: var(--color-bad); stroke-width: 1.4; stroke-dasharray: 4 4; }
.dg-marker { stroke: var(--color-warn); stroke-width: 1.2; stroke-dasharray: 3 3; }
.dg-marker-label { fill: var(--color-warn); font: 600 11px var(--font-mono); }
.dg-note { fill: var(--color-fg-faint); font: italic 11px var(--font-sans); }
.dg-fill-accent { fill: color-mix(in oklab, var(--color-accent) 16%, transparent); stroke: var(--color-accent); stroke-width: 1; }
.dg-fill-warn { fill: color-mix(in oklab, var(--color-warn) 16%, transparent); stroke: var(--color-warn); stroke-width: 1; }
.dg-box { fill: var(--color-surface); stroke: var(--color-border); stroke-width: 1.3; }
.dg-box.accent { stroke: var(--color-accent); fill: var(--color-accent-soft); }
.dg-box.good { stroke: var(--color-good); }
.dg-box-title { fill: var(--color-fg); font: 650 12px var(--font-sans); }
.dg-box-title.accent { fill: var(--color-accent); }
.dg-box-sub { fill: var(--color-fg-subtle); font: 10.5px var(--font-mono); }
.dg-node { fill: var(--color-surface); stroke: var(--color-accent); stroke-width: 1.4; }
.dg-node-label { fill: var(--color-fg); font: 600 12px var(--font-mono); }
.dg-edge { stroke: var(--color-fg-faint); stroke-width: 1.4; fill: none; }
.dg-edge-label { fill: var(--color-fg-subtle); font: 11px var(--font-mono); }
.dg-arrowhead { fill: var(--color-fg-faint); }
.dg-bar { fill: var(--color-accent); }
.dg-bar-2 { fill: var(--color-magenta); }
.dg-bar-label { fill: var(--color-fg-subtle); font: 11px var(--font-sans); }</style><text x="380" y="14" text-anchor="middle" class="dg-edge-label">min x + 2y + z   s.t.   r1: x + y &lt;= 4,   r2: y + z &lt;= 4</text><g><text x="16" y="34" class="dg-box-title">round 0: seeds</text><g><line x1="78" y1="100" x2="278" y2="62" class="dg-edge"></line></g><g><line x1="78" y1="168" x2="278" y2="62" class="dg-edge" style="stroke-width:3.2"></line><rect x="139" y="121.9" width="18" height="16" rx="4" style="fill:var(--color-bg)"></rect><text x="148" y="134.4" text-anchor="middle" class="dg-node-label">2</text></g><g><line x1="78" y1="236" x2="278" y2="62" class="dg-edge"></line></g><g><line x1="78" y1="100" x2="278" y2="134" class="dg-edge"></line></g><g><line x1="78" y1="168" x2="278" y2="134" class="dg-edge"></line></g><g><line x1="78" y1="168" x2="278" y2="202" class="dg-edge"></line></g><g><line x1="78" y1="236" x2="278" y2="202" class="dg-edge"></line></g><g><circle cx="78" cy="100" r="16" style="fill:color-mix(in oklab, var(--color-accent) 55%, var(--color-surface))" stroke="var(--color-border)"></circle><text x="78" y="104" text-anchor="middle" class="dg-node-label">x</text></g><g><circle cx="78" cy="168" r="16" style="fill:color-mix(in oklab, var(--color-accent) 55%, var(--color-surface))" stroke="var(--color-border)"></circle><text x="78" y="172" text-anchor="middle" class="dg-node-label">y</text></g><g><circle cx="78" cy="236" r="16" style="fill:color-mix(in oklab, var(--color-accent) 55%, var(--color-surface))" stroke="var(--color-border)"></circle><text x="78" y="240" text-anchor="middle" class="dg-node-label">z</text></g><g><rect x="262" y="118" width="32" height="32" rx="5" style="fill:color-mix(in oklab, var(--color-warn) 55%, var(--color-surface))" stroke="var(--color-border)"></rect><text x="278" y="138" text-anchor="middle" class="dg-node-label">r1</text></g><g><rect x="262" y="186" width="32" height="32" rx="5" style="fill:color-mix(in oklab, var(--color-warn) 55%, var(--color-surface))" stroke="var(--color-border)"></rect><text x="278" y="206" text-anchor="middle" class="dg-node-label">r2</text></g><circle cx="278" cy="62" r="17" style="fill:color-mix(in oklab, var(--color-good) 55%, var(--color-surface))" stroke="var(--color-border)"></circle><text x="278" y="66" text-anchor="middle" class="dg-node-label">obj</text><text x="16" y="276" class="dg-box-sub">3 classes: variables alike, rows alike, objective</text></g><line x1="372" y1="30" x2="372" y2="282" class="dg-grid"></line><g><text x="400" y="34" class="dg-box-title">round 1: stable</text><g><line x1="462" y1="100" x2="662" y2="62" class="dg-edge"></line></g><g><line x1="462" y1="168" x2="662" y2="62" class="dg-edge" style="stroke-width:3.2"></line><rect x="523" y="121.9" width="18" height="16" rx="4" style="fill:var(--color-bg)"></rect><text x="532" y="134.4" text-anchor="middle" class="dg-node-label">2</text></g><g><line x1="462" y1="236" x2="662" y2="62" class="dg-edge"></line></g><g><line x1="462" y1="100" x2="662" y2="134" class="dg-edge"></line></g><g><line x1="462" y1="168" x2="662" y2="134" class="dg-edge"></line></g><g><line x1="462" y1="168" x2="662" y2="202" class="dg-edge"></line></g><g><line x1="462" y1="236" x2="662" y2="202" class="dg-edge"></line></g><g><circle cx="462" cy="100" r="16" style="fill:color-mix(in oklab, var(--color-accent) 55%, var(--color-surface))" stroke="var(--color-border)"></circle><text x="462" y="104" text-anchor="middle" class="dg-node-label">x</text></g><g><circle cx="462" cy="168" r="16" style="fill:color-mix(in oklab, var(--color-magenta) 60%, var(--color-surface))" stroke="var(--color-border)"></circle><text x="462" y="172" text-anchor="middle" class="dg-node-label">y</text></g><g><circle cx="462" cy="236" r="16" style="fill:color-mix(in oklab, var(--color-accent) 55%, var(--color-surface))" stroke="var(--color-border)"></circle><text x="462" y="240" text-anchor="middle" class="dg-node-label">z</text></g><g><rect x="646" y="118" width="32" height="32" rx="5" style="fill:color-mix(in oklab, var(--color-warn) 55%, var(--color-surface))" stroke="var(--color-border)"></rect><text x="662" y="138" text-anchor="middle" class="dg-node-label">r1</text></g><g><rect x="646" y="186" width="32" height="32" rx="5" style="fill:color-mix(in oklab, var(--color-warn) 55%, var(--color-surface))" stroke="var(--color-border)"></rect><text x="662" y="206" text-anchor="middle" class="dg-node-label">r2</text></g><circle cx="662" cy="62" r="17" style="fill:color-mix(in oklab, var(--color-good) 55%, var(--color-surface))" stroke="var(--color-border)"></circle><text x="662" y="66" text-anchor="middle" class="dg-node-label">obj</text><text x="400" y="276" class="dg-box-sub">4 classes: y separates; x and z never will</text></g><text x="380" y="306" text-anchor="middle" class="dg-note">Each round recolours a node from its colour and the multiset of (weight, neighbour colour) pairs. It stops when nothing splits.</text><text x="380" y="324" text-anchor="middle" class="dg-note">Different stable colourings prove the graphs non-isomorphic. Equal ones prove nothing: a 6-cycle and two triangles never separate.</text></svg>
