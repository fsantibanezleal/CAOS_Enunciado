<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" class="fig-svg wide" viewBox="0 0 760 330" role="img" aria-label="One pair under two canonical forms"><style>svg { --color-bg: #f6f8fa; --color-surface: #ffffff; --color-surface-2: #f0f3f6; --color-border: #d0d7de; --color-fg: #1f2328; --color-fg-subtle: #57606a; --color-fg-faint: #6e7781; --color-accent: #0969da; --color-accent-fg: #ffffff; --color-accent-soft: #ddf4ff; --color-accent-2: #0a7c8a; --color-magenta: #bf3989; --color-good: #1a7f37; --color-warn: #9a6700; --color-bad: #cf222e; --color-shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 10px rgba(31, 35, 40, 0.04); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-family: var(--font-sans); }
@media (prefers-color-scheme: dark) { svg { --color-bg: #0d1117; --color-surface: #161b22; --color-surface-2: #1c2230; --color-border: #30363d; --color-fg: #c9d1d9; --color-fg-subtle: #9aa6b2; --color-fg-faint: #6c7785; --color-accent: #58a6ff; --color-accent-fg: #0d1117; --color-accent-soft: #132036; --color-accent-2: #3fb1c8; --color-magenta: #f778ba; --color-good: #3fb950; --color-warn: #d29922; --color-bad: #f85149; --color-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.45); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; } }
.dg-axis { stroke: var(--color-fg-faint); stroke-width: 1.3; }
.dg-axis-label { fill: var(--color-fg-subtle); font: 12px var(--font-sans); }
.dg-tick { fill: var(--color-fg-faint); font: 11px var(--font-mono); }
.dg-grid { stroke: var(--color-border); stroke-width: 0.5; opacity: 0.6; }
.dg-curve { fill: none; stroke: var(--color-accent); stroke-width: 2.2; stroke-linejoin: round; }
.dg-curve-2 { fill: none; stroke: var(--color-magenta); stroke-width: 2; }
.dg-curve-faint { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.4; stroke-dasharray: 4 3; }
.dg-asymptote { stroke: var(--color-bad); stroke-width: 1.4; stroke-dasharray: 4 4; }
.dg-marker { stroke: var(--color-warn); stroke-width: 1.2; stroke-dasharray: 3 3; }
.dg-marker-label { fill: var(--color-warn); font: 600 11px var(--font-mono); }
.dg-note { fill: var(--color-fg-faint); font: italic 11px var(--font-sans); }
.dg-fill-accent { fill: color-mix(in oklab, var(--color-accent) 16%, transparent); stroke: var(--color-accent); stroke-width: 1; }
.dg-fill-warn { fill: color-mix(in oklab, var(--color-warn) 16%, transparent); stroke: var(--color-warn); stroke-width: 1; }
.dg-box { fill: var(--color-surface); stroke: var(--color-border); stroke-width: 1.3; }
.dg-box.accent { stroke: var(--color-accent); fill: var(--color-accent-soft); }
.dg-box.good { stroke: var(--color-good); }
.dg-box-title { fill: var(--color-fg); font: 650 12px var(--font-sans); }
.dg-box-title.accent { fill: var(--color-accent); }
.dg-box-sub { fill: var(--color-fg-subtle); font: 10.5px var(--font-mono); }
.dg-node { fill: var(--color-surface); stroke: var(--color-accent); stroke-width: 1.4; }
.dg-node-label { fill: var(--color-fg); font: 600 12px var(--font-mono); }
.dg-edge { stroke: var(--color-fg-faint); stroke-width: 1.4; fill: none; }
.dg-edge-label { fill: var(--color-fg-subtle); font: 11px var(--font-mono); }
.dg-arrowhead { fill: var(--color-fg-faint); }
.dg-bar { fill: var(--color-accent); }
.dg-bar-2 { fill: var(--color-magenta); }
.dg-bar-label { fill: var(--color-fg-subtle); font: 11px var(--font-sans); }</style><defs><marker id="canon-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"></path></marker></defs><rect x="10" y="46" width="230" height="214" rx="9" class="dg-box accent"></rect><text x="24" y="68" class="dg-box-title accent">The pair</text><text x="24" y="94" class="dg-box-title">A</text><text x="44" y="94" class="dg-box-sub">max 3x + 2y</text><text x="44" y="112" class="dg-box-sub">x + y &lt;= 10</text><text x="44" y="130" class="dg-box-sub">2x + y &lt;= 16</text><line x1="24" y1="150" x2="226" y2="150" class="dg-grid"></line><text x="24" y="176" class="dg-box-title">B</text><text x="44" y="176" class="dg-box-sub">min -2y - 3x</text><text x="44" y="194" class="dg-box-sub">16 &gt;= y + 2x</text><text x="44" y="212" class="dg-box-sub">y + x &lt;= 10</text><text x="24" y="242" class="dg-note">the same model, written twice</text><line x1="244" y1="118" x2="290" y2="86" class="dg-edge" marker-end="url(#canon-arrow)"></line><rect x="294" y="34" width="250" height="100" rx="8" class="dg-box"></rect><text x="308" y="56" class="dg-box-title">planteo: document form</text><text x="308" y="76" class="dg-box-sub">renames by structure, sorts terms,</text><text x="308" y="93" class="dg-box-sub">orients comparator sides;</text><text x="308" y="110" class="dg-box-sub" style="fill:var(--color-warn)">keeps the objective sense</text><text x="308" y="126" class="dg-edge-label">decides the published verdict</text><line x1="548" y1="84" x2="580" y2="84" class="dg-edge" marker-end="url(#canon-arrow)"></line><rect x="584" y="54" width="166" height="60" rx="8" class="dg-box" opacity="0.8"></rect><text x="667" y="80" text-anchor="middle" class="dg-box-title">NOT PROVEN</text><text x="667" y="100" text-anchor="middle" class="dg-box-sub">max against min</text><line x1="244" y1="190" x2="290" y2="222" class="dg-edge" marker-end="url(#canon-arrow)"></line><rect x="294" y="174" width="250" height="100" rx="8" class="dg-box good"></rect><text x="308" y="196" class="dg-box-title">workbench: linear form</text><text x="308" y="216" class="dg-box-sub">fixes the sense to minimise,</text><text x="308" y="233" class="dg-box-sub">moves every term left,</text><text x="308" y="250" class="dg-box-sub">normalises rows and sign; WL order</text><text x="308" y="266" class="dg-edge-label">shown, not published</text><line x1="548" y1="224" x2="580" y2="224" class="dg-edge" marker-end="url(#canon-arrow)"></line><rect x="584" y="194" width="166" height="60" rx="8" class="dg-box good"></rect><text x="667" y="220" text-anchor="middle" class="dg-box-title accent">EQUIVALENT</text><text x="667" y="240" text-anchor="middle" class="dg-box-sub">equal digest</text><text x="380" y="302" text-anchor="middle" class="dg-note">Neither can call two different models equivalent: each applies only rewrites that keep the solution set.</text><text x="380" y="320" text-anchor="middle" class="dg-note">The weaker one errs only in the safe direction: an extra NOT PROVEN, never a false EQUIVALENT.</text></svg>
