<svg xmlns="http://www.w3.org/2000/svg" width="760" height="246" class="fig-svg wide" viewBox="0 0 760 246" role="img" aria-label="What each layer can conclude"><style>svg { --color-bg: #f6f8fa; --color-surface: #ffffff; --color-surface-2: #f0f3f6; --color-border: #d0d7de; --color-fg: #1f2328; --color-fg-subtle: #57606a; --color-fg-faint: #6e7781; --color-accent: #0969da; --color-accent-fg: #ffffff; --color-accent-soft: #ddf4ff; --color-accent-2: #0a7c8a; --color-magenta: #bf3989; --color-good: #1a7f37; --color-warn: #9a6700; --color-bad: #cf222e; --color-shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 10px rgba(31, 35, 40, 0.04); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-family: var(--font-sans); }
@media (prefers-color-scheme: dark) { svg { --color-bg: #0d1117; --color-surface: #161b22; --color-surface-2: #1c2230; --color-border: #30363d; --color-fg: #c9d1d9; --color-fg-subtle: #9aa6b2; --color-fg-faint: #6c7785; --color-accent: #58a6ff; --color-accent-fg: #0d1117; --color-accent-soft: #132036; --color-accent-2: #3fb1c8; --color-magenta: #f778ba; --color-good: #3fb950; --color-warn: #d29922; --color-bad: #f85149; --color-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.45); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; } }
.dg-axis { stroke: var(--color-fg-faint); stroke-width: 1.3; }
.dg-axis-label { fill: var(--color-fg-subtle); font: 12px var(--font-sans); }
.dg-tick { fill: var(--color-fg-faint); font: 11px var(--font-mono); }
.dg-grid { stroke: var(--color-border); stroke-width: 0.5; opacity: 0.6; }
.dg-curve { fill: none; stroke: var(--color-accent); stroke-width: 2.2; stroke-linejoin: round; }
.dg-curve-2 { fill: none; stroke: var(--color-magenta); stroke-width: 2; }
.dg-curve-faint { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.4; stroke-dasharray: 4 3; }
.dg-asymptote { stroke: var(--color-bad); stroke-width: 1.4; stroke-dasharray: 4 4; }
.dg-marker { stroke: var(--color-warn); stroke-width: 1.2; stroke-dasharray: 3 3; }
.dg-marker-label { fill: var(--color-warn); font: 600 11px var(--font-mono); }
.dg-note { fill: var(--color-fg-faint); font: italic 11px var(--font-sans); }
.dg-fill-accent { fill: color-mix(in oklab, var(--color-accent) 16%, transparent); stroke: var(--color-accent); stroke-width: 1; }
.dg-fill-warn { fill: color-mix(in oklab, var(--color-warn) 16%, transparent); stroke: var(--color-warn); stroke-width: 1; }
.dg-box { fill: var(--color-surface); stroke: var(--color-border); stroke-width: 1.3; }
.dg-box.accent { stroke: var(--color-accent); fill: var(--color-accent-soft); }
.dg-box.good { stroke: var(--color-good); }
.dg-box-title { fill: var(--color-fg); font: 650 12px var(--font-sans); }
.dg-box-title.accent { fill: var(--color-accent); }
.dg-box-sub { fill: var(--color-fg-subtle); font: 10.5px var(--font-mono); }
.dg-node { fill: var(--color-surface); stroke: var(--color-accent); stroke-width: 1.4; }
.dg-node-label { fill: var(--color-fg); font: 600 12px var(--font-mono); }
.dg-edge { stroke: var(--color-fg-faint); stroke-width: 1.4; fill: none; }
.dg-edge-label { fill: var(--color-fg-subtle); font: 11px var(--font-mono); }
.dg-arrowhead { fill: var(--color-fg-faint); }
.dg-bar { fill: var(--color-accent); }
.dg-bar-2 { fill: var(--color-magenta); }
.dg-bar-label { fill: var(--color-fg-subtle); font: 11px var(--font-sans); }</style><text x="20" y="16" class="dg-axis-label">layer</text><text x="190" y="16" class="dg-axis-label">concludes</text><text x="470" y="16" class="dg-axis-label">does not conclude</text><g><rect x="12" y="28" width="160" height="42" rx="8" class="dg-box" opacity="1"></rect><text x="92" y="54" text-anchor="middle" class="dg-box-title">Executable</text><rect x="184" y="28" width="272" height="42" rx="6" class="dg-box" opacity="0.5"></rect><text x="196" y="54" class="dg-box-sub">it ran, it solved, it compiled</text><rect x="468" y="28" width="280" height="42" rx="6" class="dg-box" opacity="0.5"></rect><text x="480" y="54" class="dg-box-sub" style="fill:var(--color-bad)">says nothing about meaning</text></g><g><rect x="12" y="80" width="160" height="42" rx="8" class="dg-box accent" opacity="1"></rect><text x="92" y="106" text-anchor="middle" class="dg-box-title">Structural</text><rect x="184" y="80" width="272" height="42" rx="6" class="dg-box" opacity="0.5"></rect><text x="196" y="106" class="dg-box-sub">equal canonical forms =&gt; equivalent</text><rect x="468" y="80" width="280" height="42" rx="6" class="dg-box" opacity="0.5"></rect><text x="480" y="106" class="dg-box-sub" style="fill:var(--color-bad)">different forms do not prove difference</text></g><g><rect x="12" y="132" width="160" height="42" rx="8" class="dg-box accent" opacity="1"></rect><text x="92" y="158" text-anchor="middle" class="dg-box-title">Property</text><rect x="184" y="132" width="272" height="42" rx="6" class="dg-box" opacity="0.5"></rect><text x="196" y="158" class="dg-box-sub">one violated relation =&gt; refuted</text><rect x="468" y="132" width="280" height="42" rx="6" class="dg-box" opacity="0.5"></rect><text x="480" y="158" class="dg-box-sub" style="fill:var(--color-bad)">all holding does not prove correct</text></g><g><rect x="12" y="184" width="160" height="42" rx="8" class="dg-box" opacity="0.7"></rect><text x="92" y="210" text-anchor="middle" class="dg-box-title">Judge</text><rect x="184" y="184" width="272" height="42" rx="6" class="dg-box" opacity="0.5"></rect><text x="196" y="210" class="dg-box-sub">calibrated aggregate, for comparison</text><rect x="468" y="184" width="280" height="42" rx="6" class="dg-box" opacity="0.5"></rect><text x="480" y="210" class="dg-box-sub" style="fill:var(--color-bad)">NOT an equivalence oracle</text></g></svg>
