="216" class="dg-box-sub">rounding the relaxed answer</text><text x="542" y="234" class="dg-box-sub">leaves the feasible set</text><text x="380" y="318" text-anchor="middle" class="dg-note">The relaxation bounds the integer optimum and does not say where it is. A model that forgets integrality reports the bound as the answer.</text></svg>
