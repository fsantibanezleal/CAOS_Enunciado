<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" class="fig-svg wide" viewBox="0 0 700 240" role="img" aria-label="Which comparisons conclude"><style>svg { --color-bg: #f6f8fa; --color-surface: #ffffff; --color-surface-2: #f0f3f6; --color-border: #d0d7de; --color-fg: #1f2328; --color-fg-subtle: #57606a; --color-fg-faint: #6e7781; --color-accent: #0969da; --color-accent-fg: #ffffff; --color-accent-soft: #ddf4ff; --color-accent-2: #0a7c8a; --color-magenta: #bf3989; --color-good: #1a7f37; --color-warn: #9a6700; --color-bad: #cf222e; --color-shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 10px rgba(31, 35, 40, 0.04); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-family: var(--font-sans); }
@media (prefers-color-scheme: dark) { svg { --color-bg: #0d1117; --color-surface: #161b22; --color-surface-2: #1c2230; --color-border: #30363d; --color-fg: #c9d1d9; --color-fg-subtle: #9aa6b2; --color-fg-faint: #6c7785; --color-accent: #58a6ff; --color-accent-fg: #0d1117; --color-accent-soft: #132036; --color-accent-2: #3fb1c8; --color-magenta: #f778ba; --color-good: #3fb950; --color-warn: #d29922; --color-bad: #f85149; --color-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.45); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; } }
.dg-axis { stroke: var(--color-fg-faint); stroke-width: 1.3; }
.dg-axis-label { fill: var(--color-fg-subtle); font: 12px var(--font-sans); }
.dg-tick { fill: var(--color-fg-faint); font: 11px var(--font-mono); }
.dg-grid { stroke: var(--color-border); stroke-width: 0.5; opacity: 0.6; }
.dg-curve { fill: none; stroke: var(--color-accent); stroke-width: 2.2; stroke-linejoin: round; }
.dg-curve-2 { fill: none; stroke: var(--color-magenta); stroke-width: 2; }
.dg-curve-faint { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.4; stroke-dasharray: 4 3; }
.dg-asymptote { stroke: var(--color-bad); stroke-width: 1.4; stroke-dasharray: 4 4; }
.dg-marker { stroke: var(--color-warn); stroke-width: 1.2; stroke-dasharray: 3 3; }
.dg-marker-label { fill: var(--color-warn); font: 600 11px var(--font-mono); }
.dg-note { fill: var(--color-fg-faint); font: italic 11px var(--font-sans); }
.dg-fill-accent { fill: color-mix(in oklab, var(--color-accent) 16%, transparent); stroke: var(--color-accent); stroke-width: 1; }
.dg-fill-warn { fill: color-mix(in oklab, var(--color-warn) 16%, transparent); stroke: var(--color-warn); stroke-width: 1; }
.dg-box { fill: var(--color-surface); stroke: var(--color-border); stroke-width: 1.3; }
.dg-box.accent { stroke: var(--color-accent); fill: var(--color-accent-soft); }
.dg-box.good { stroke: var(--color-good); }
.dg-box-title { fill: var(--color-fg); font: 650 12px var(--font-sans); }
.dg-box-title.accent { fill: var(--color-accent); }
.dg-box-sub { fill: var(--color-fg-subtle); font: 10.5px var(--font-mono); }
.dg-node { fill: var(--color-surface); stroke: var(--color-accent); stroke-width: 1.4; }
.dg-node-label { fill: var(--color-fg); font: 600 12px var(--font-mono); }
.dg-edge { stroke: var(--color-fg-faint); stroke-width: 1.4; fill: none; }
.dg-edge-label { fill: var(--color-fg-subtle); font: 11px var(--font-mono); }
.dg-arrowhead { fill: var(--color-fg-faint); }
.dg-bar { fill: var(--color-accent); }
.dg-bar-2 { fill: var(--color-magenta); }
.dg-bar-label { fill: var(--color-fg-subtle); font: 11px var(--font-sans); }</style><defs><marker id="refute-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"></path></marker></defs><g><rect x="8" y="20" width="250" height="40" rx="8" class="dg-box"></rect><text x="133" y="45" text-anchor="middle" class="dg-box-sub">canonical forms equal</text><line x1="262" y1="40" x2="330" y2="40" class="dg-edge" marker-end="url(#refute-arrow)"></line><rect x="336" y="20" width="210" height="40" rx="8" class="dg-box accent" opacity="1"></rect><text x="441" y="45" text-anchor="middle" class="dg-box-title accent">EQUIVALENT</text></g><g><rect x="8" y="74" width="250" height="40" rx="8" class="dg-box"></rect><text x="133" y="99" text-anchor="middle" class="dg-box-sub">different optima</text><line x1="262" y1="94" x2="330" y2="94" class="dg-edge" marker-end="url(#refute-arrow)"></line><rect x="336" y="74" width="210" height="40" rx="8" class="dg-box accent" opacity="1"></rect><text x="441" y="99" text-anchor="middle" class="dg-box-title accent">REFUTED</text></g><g><rect x="8" y="128" width="250" height="40" rx="8" class="dg-box"></rect><text x="133" y="153" text-anchor="middle" class="dg-box-sub">matching optima</text><line x1="262" y1="148" x2="330" y2="148" class="dg-edge" marker-end="url(#refute-arrow)"></line><rect x="336" y="128" width="210" height="40" rx="8" class="dg-box" opacity="0.55"></rect><text x="441" y="153" text-anchor="middle" class="dg-box-sub">concludes nothing</text><line x1="336" y1="168" x2="546" y2="128" class="dg-asymptote"></line></g><g><rect x="8" y="182" width="250" height="40" rx="8" class="dg-box"></rect><text x="133" y="207" text-anchor="middle" class="dg-box-sub">different forms</text><line x1="262" y1="202" x2="330" y2="202" class="dg-edge" marker-end="url(#refute-arrow)"></line><rect x="336" y="182" width="210" height="40" rx="8" class="dg-box" opacity="0.55"></rect><text x="441" y="207" text-anchor="middle" class="dg-box-sub">concludes nothing</text><line x1="336" y1="222" x2="546" y2="182" class="dg-asymptote"></line></g><text x="350" y="232" text-anchor="middle" class="dg-note">A matching optimum never promotes a verdict: compensating errors reach the right number.</text></svg>
