<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" class="fig-svg wide" viewBox="0 0 760 320" role="img" aria-label="Where each part runs"><style>svg { --color-bg: #f6f8fa; --color-surface: #ffffff; --color-surface-2: #f0f3f6; --color-border: #d0d7de; --color-fg: #1f2328; --color-fg-subtle: #57606a; --color-fg-faint: #6e7781; --color-accent: #0969da; --color-accent-fg: #ffffff; --color-accent-soft: #ddf4ff; --color-accent-2: #0a7c8a; --color-magenta: #bf3989; --color-good: #1a7f37; --color-warn: #9a6700; --color-bad: #cf222e; --color-shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 10px rgba(31, 35, 40, 0.04); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-family: var(--font-sans); }
@media (prefers-color-scheme: dark) { svg { --color-bg: #0d1117; --color-surface: #161b22; --color-surface-2: #1c2230; --color-border: #30363d; --color-fg: #c9d1d9; --color-fg-subtle: #9aa6b2; --color-fg-faint: #6c7785; --color-accent: #58a6ff; --color-accent-fg: #0d1117; --color-accent-soft: #132036; --color-accent-2: #3fb1c8; --color-magenta: #f778ba; --color-good: #3fb950; --color-warn: #d29922; --color-bad: #f85149; --color-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.45); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; } }
.dg-axis { stroke: var(--color-fg-faint); stroke-width: 1.3; }
.dg-axis-label { fill: var(--color-fg-subtle); font: 12px var(--font-sans); }
.dg-tick { fill: var(--color-fg-faint); font: 11px var(--font-mono); }
.dg-grid { stroke: var(--color-border); stroke-width: 0.5; opacity: 0.6; }
.dg-curve { fill: none; stroke: var(--color-accent); stroke-width: 2.2; stroke-linejoin: round; }
.dg-curve-2 { fill: none; stroke: var(--color-magenta); stroke-width: 2; }
.dg-curve-faint { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.4; stroke-dasharray: 4 3; }
.dg-asymptote { stroke: var(--color-bad); stroke-width: 1.4; stroke-dasharray: 4 4; }
.dg-marker { stroke: var(--color-warn); stroke-width: 1.2; stroke-dasharray: 3 3; }
.dg-marker-label { fill: var(--color-warn); font: 600 11px var(--font-mono); }
.dg-note { fill: var(--color-fg-faint); font: italic 11px var(--font-sans); }
.dg-fill-accent { fill: color-mix(in oklab, var(--color-accent) 16%, transparent); stroke: var(--color-accent); stroke-width: 1; }
.dg-fill-warn { fill: color-mix(in oklab, var(--color-warn) 16%, transparent); stroke: var(--color-warn); stroke-width: 1; }
.dg-box { fill: var(--color-surface); stroke: var(--color-border); stroke-width: 1.3; }
.dg-box.accent { stroke: var(--color-accent); fill: var(--color-accent-soft); }
.dg-box.good { stroke: var(--color-good); }
.dg-box-title { fill: var(--color-fg); font: 650 12px var(--font-sans); }
.dg-box-title.accent { fill: var(--color-accent); }
.dg-box-sub { fill: var(--color-fg-subtle); font: 10.5px var(--font-mono); }
.dg-node { fill: var(--color-surface); stroke: var(--color-accent); stroke-width: 1.4; }
.dg-node-label { fill: var(--color-fg); font: 600 12px var(--font-mono); }
.dg-edge { stroke: var(--color-fg-faint); stroke-width: 1.4; fill: none; }
.dg-edge-label { fill: var(--color-fg-subtle); font: 11px var(--font-mono); }
.dg-arrowhead { fill: var(--color-fg-faint); }
.dg-bar { fill: var(--color-accent); }
.dg-bar-2 { fill: var(--color-magenta); }
.dg-bar-label { fill: var(--color-fg-subtle); font: 11px var(--font-sans); }</style><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"></path></marker></defs><rect x="8" y="26" width="236" height="186" rx="10" class="dg-box"></rect><text x="126" y="46" text-anchor="middle" class="dg-box-title">Offline, heavy</text><g><rect x="22" y="56" width="208" height="32" rx="6" class="dg-box accent"></rect><text x="32" y="72" class="dg-box-title accent">planteo</text><text x="224" y="72" text-anchor="end" class="dg-box-sub">typed document</text></g><g><rect x="22" y="94" width="208" height="32" rx="6" class="dg-box accent"></rect><text x="32" y="110" class="dg-box-title accent">Pyomo + HiGHS</text><text x="224" y="110" text-anchor="end" class="dg-box-sub">solves the reference</text></g><g><rect x="22" y="132" width="208" height="32" rx="6" class="dg-box accent"></rect><text x="32" y="148" class="dg-box-title accent">copela</text><text x="224" y="148" text-anchor="end" class="dg-box-sub">sweep and ledger</text></g><g><rect x="22" y="170" width="208" height="32" rx="6" class="dg-box accent"></rect><text x="32" y="186" class="dg-box-title accent">bake.py</text><text x="224" y="186" text-anchor="end" class="dg-box-sub">verifies every case</text></g><rect x="272" y="80" width="186" height="78" rx="10" class="dg-box good"></rect><text x="365" y="104" text-anchor="middle" class="dg-box-title">Committed artifact</text><text x="365" y="122" text-anchor="middle" class="dg-box-sub">cases.json + manifest.json</text><text x="365" y="140" text-anchor="middle" class="dg-box-sub">221 KB</text><line x1="246" y1="119" x2="268" y2="119" class="dg-edge" marker-end="url(#arch-arrow)"></line><rect x="486" y="26" width="266" height="186" rx="10" class="dg-box"></rect><text x="619" y="46" text-anchor="middle" class="dg-box-title">Browser, no server</text><g><rect x="500" y="56" width="238" height="32" rx="6" class="dg-box accent"></rect><text x="510" y="72" class="dg-box-title accent">React + shell</text><text x="732" y="72" text-anchor="end" class="dg-box-sub">six routes</text></g><g><rect x="500" y="94" width="238" height="32" rx="6" class="dg-box accent"></rect><text x="510" y="110" class="dg-box-title accent">highs.wasm</text><text x="732" y="110" text-anchor="end" class="dg-box-sub">3.37 MB, lazy</text></g><g><rect x="500" y="132" width="238" height="32" rx="6" class="dg-box accent"></rect><text x="510" y="148" class="dg-box-title accent">live solve</text><text x="732" y="148" text-anchor="end" class="dg-box-sub">sub-millisecond</text></g><g><rect x="500" y="170" width="238" height="32" rx="6" class="dg-box accent"></rect><text x="510" y="186" class="dg-box-title accent">uPlot + canvas</text><text x="732" y="186" text-anchor="end" class="dg-box-sub">read-out at the cursor</text></g><line x1="462" y1="119" x2="482" y2="119" class="dg-edge" marker-end="url(#arch-arrow)"></line><line x1="262" y1="236" x2="262" y2="266" class="dg-marker"></line><text x="380" y="252" text-anchor="middle" class="dg-marker-label">the live / precomputed boundary</text><text x="380" y="284" text-anchor="middle" class="dg-note">Every published number comes from the artifact. What the browser computes explains the answer and is never published.</text><text x="380" y="304" text-anchor="middle" class="dg-note">No secret reaches the browser, because no lane needs one.</text></svg>
