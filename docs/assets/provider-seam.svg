<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" class="fig-svg wide" viewBox="0 0 700 300" role="img" aria-label="What a run record can pin"><style>svg { --color-bg: #f6f8fa; --color-surface: #ffffff; --color-surface-2: #f0f3f6; --color-border: #d0d7de; --color-fg: #1f2328; --color-fg-subtle: #57606a; --color-fg-faint: #6e7781; --color-accent: #0969da; --color-accent-fg: #ffffff; --color-accent-soft: #ddf4ff; --color-accent-2: #0a7c8a; --color-magenta: #bf3989; --color-good: #1a7f37; --color-warn: #9a6700; --color-bad: #cf222e; --color-shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 10px rgba(31, 35, 40, 0.04); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-family: var(--font-sans); }
@media (prefers-color-scheme: dark) { svg { --color-bg: #0d1117; --color-surface: #161b22; --color-surface-2: #1c2230; --color-border: #30363d; --color-fg: #c9d1d9; --color-fg-subtle: #9aa6b2; --color-fg-faint: #6c7785; --color-accent: #58a6ff; --color-accent-fg: #0d1117; --color-accent-soft: #132036; --color-accent-2: #3fb1c8; --color-magenta: #f778ba; --color-good: #3fb950; --color-warn: #d29922; --color-bad: #f85149; --color-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.45); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; } }
.dg-axis { stroke: var(--color-fg-faint); stroke-width: 1.3; }
.dg-axis-label { fill: var(--color-fg-subtle); font: 12px var(--font-sans); }
.dg-tick { fill: var(--color-fg-faint); font: 11px var(--font-mono); }
.dg-grid { stroke: var(--color-border); stroke-width: 0.5; opacity: 0.6; }
.dg-curve { fill: none; stroke: var(--color-accent); stroke-width: 2.2; stroke-linejoin: round; }
.dg-curve-2 { fill: none; stroke: var(--color-magenta); stroke-width: 2; }
.dg-curve-faint { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.4; stroke-dasharray: 4 3; }
.dg-asymptote { stroke: var(--color-bad); stroke-width: 1.4; stroke-dasharray: 4 4; }
.dg-marker { stroke: var(--color-warn); stroke-width: 1.2; stroke-dasharray: 3 3; }
.dg-marker-label { fill: var(--color-warn); font: 600 11px var(--font-mono); }
.dg-note { fill: var(--color-fg-faint); font: italic 11px var(--font-sans); }
.dg-fill-accent { fill: color-mix(in oklab, var(--color-accent) 16%, transparent); stroke: var(--color-accent); stroke-width: 1; }
.dg-fill-warn { fill: color-mix(in oklab, var(--color-warn) 16%, transparent); stroke: var(--color-warn); stroke-width: 1; }
.dg-box { fill: var(--color-surface); stroke: var(--color-border); stroke-width: 1.3; }
.dg-box.accent { stroke: var(--color-accent); fill: var(--color-accent-soft); }
.dg-box.good { stroke: var(--color-good); }
.dg-box-title { fill: var(--color-fg); font: 650 12px var(--font-sans); }
.dg-box-title.accent { fill: var(--color-accent); }
.dg-box-sub { fill: var(--color-fg-subtle); font: 10.5px var(--font-mono); }
.dg-node { fill: var(--color-surface); stroke: var(--color-accent); stroke-width: 1.4; }
.dg-node-label { fill: var(--color-fg); font: 600 12px var(--font-mono); }
.dg-edge { stroke: var(--color-fg-faint); stroke-width: 1.4; fill: none; }
.dg-edge-label { fill: var(--color-fg-subtle); font: 11px var(--font-mono); }
.dg-arrowhead { fill: var(--color-fg-faint); }
.dg-bar { fill: var(--color-accent); }
.dg-bar-2 { fill: var(--color-magenta); }
.dg-bar-label { fill: var(--color-fg-subtle); font: 11px var(--font-sans); }</style><defs><marker id="seam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"></path></marker></defs><rect x="8" y="26" width="316" height="196" rx="10" class="dg-box accent"></rect><text x="166" y="50" text-anchor="middle" class="dg-box-title accent">Pinned, and recorded</text><text x="28" y="78" class="dg-box-sub">model id</text><text x="28" y="105" class="dg-box-sub">model version</text><text x="28" y="132" class="dg-box-sub">prompt digest</text><text x="28" y="159" class="dg-box-sub">token cap</text><text x="28" y="186" class="dg-box-sub">effort, where the model takes it</text><rect x="376" y="26" width="316" height="196" rx="10" class="dg-box"></rect><text x="534" y="50" text-anchor="middle" class="dg-box-title">Cannot be pinned</text><text x="396" y="78" class="dg-box-sub" style="fill:var(--color-bad)">the service&#x27;s batch size</text><text x="396" y="105" class="dg-box-sub" style="fill:var(--color-bad)">reduction kernels</text><text x="396" y="132" class="dg-box-sub" style="fill:var(--color-bad)">numerical precision</text><text x="396" y="159" class="dg-box-sub" style="fill:var(--color-bad)">cache use</text><text x="396" y="186" class="dg-box-sub" style="fill:var(--color-bad)">server hardware and software</text><line x1="350" y1="40" x2="350" y2="212" class="dg-asymptote"></line><text x="350" y="232" text-anchor="middle" class="dg-marker-label">the provider seam</text><text x="350" y="262" text-anchor="middle" class="dg-note">That is why the record reports n repeats with a tolerance band, rather than claiming an exact reproduction it does not have.</text><text x="350" y="282" text-anchor="middle" class="dg-note">A fingerprint claiming temperature=0 for a provider that does not accept it is reproducibility asserted and not exercised.</text></svg>
