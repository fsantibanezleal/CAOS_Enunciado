<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" class="fig-svg wide" viewBox="0 0 760 330" role="img" aria-label="The geometry of an LP optimum and its dual certificate"><style>svg { --color-bg: #f6f8fa; --color-surface: #ffffff; --color-surface-2: #f0f3f6; --color-border: #d0d7de; --color-fg: #1f2328; --color-fg-subtle: #57606a; --color-fg-faint: #6e7781; --color-accent: #0969da; --color-accent-fg: #ffffff; --color-accent-soft: #ddf4ff; --color-accent-2: #0a7c8a; --color-magenta: #bf3989; --color-good: #1a7f37; --color-warn: #9a6700; --color-bad: #cf222e; --color-shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 10px rgba(31, 35, 40, 0.04); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-family: var(--font-sans); }
@media (prefers-color-scheme: dark) { svg { --color-bg: #0d1117; --color-surface: #161b22; --color-surface-2: #1c2230; --color-border: #30363d; --color-fg: #c9d1d9; --color-fg-subtle: #9aa6b2; --color-fg-faint: #6c7785; --color-accent: #58a6ff; --color-accent-fg: #0d1117; --color-accent-soft: #132036; --color-accent-2: #3fb1c8; --color-magenta: #f778ba; --color-good: #3fb950; --color-warn: #d29922; --color-bad: #f85149; --color-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.45); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; } }
.dg-axis { stroke: var(--color-fg-faint); stroke-width: 1.3; }
.dg-axis-label { fill: var(--color-fg-subtle); font: 12px var(--font-sans); }
.dg-tick { fill: var(--color-fg-faint); font: 11px var(--font-mono); }
.dg-grid { stroke: var(--color-border); stroke-width: 0.5; opacity: 0.6; }
.dg-curve { fill: none; stroke: var(--color-accent); stroke-width: 2.2; stroke-linejoin: round; }
.dg-curve-2 { fill: none; stroke: var(--color-magenta); stroke-width: 2; }
.dg-curve-faint { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.4; stroke-dasharray: 4 3; }
.dg-asymptote { stroke: var(--color-bad); stroke-width: 1.4; stroke-dasharray: 4 4; }
.dg-marker { stroke: var(--color-warn); stroke-width: 1.2; stroke-dasharray: 3 3; }
.dg-marker-label { fill: var(--color-warn); font: 600 11px var(--font-mono); }
.dg-note { fill: var(--color-fg-faint); font: italic 11px var(--font-sans); }
.dg-fill-accent { fill: color-mix(in oklab, var(--color-accent) 16%, transparent); stroke: var(--color-accent); stroke-width: 1; }
.dg-fill-warn { fill: color-mix(in oklab, var(--color-warn) 16%, transparent); stroke: var(--color-warn); stroke-width: 1; }
.dg-box { fill: var(--color-surface); stroke: var(--color-border); stroke-width: 1.3; }
.dg-box.accent { stroke: var(--color-accent); fill: var(--color-accent-soft); }
.dg-box.good { stroke: var(--color-good); }
.dg-box-title { fill: var(--color-fg); font: 650 12px var(--font-sans); }
.dg-box-title.accent { fill: var(--color-accent); }
.dg-box-sub { fill: var(--color-fg-subtle); font: 10.5px var(--font-mono); }
.dg-node { fill: var(--color-surface); stroke: var(--color-accent); stroke-width: 1.4; }
.dg-node-label { fill: var(--color-fg); font: 600 12px var(--font-mono); }
.dg-edge { stroke: var(--color-fg-faint); stroke-width: 1.4; fill: none; }
.dg-edge-label { fill: var(--color-fg-subtle); font: 11px var(--font-mono); }
.dg-arrowhead { fill: var(--color-fg-faint); }
.dg-bar { fill: var(--color-accent); }
.dg-bar-2 { fill: var(--color-magenta); }
.dg-bar-label { fill: var(--color-fg-subtle); font: 11px var(--font-sans); }</style><defs><marker id="dual-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"></path></marker></defs><text x="16" y="16" class="dg-edge-label">max 2x + 3y   s.t.   r1: x + y &lt;= 4,   r2: x + 3y &lt;= 6,   r3: x &lt;= 3.5</text><line x1="50" y1="290" x2="480" y2="290" class="dg-axis"></line><line x1="50" y1="290" x2="50" y2="50" class="dg-axis"></line><text x="480" y="306" text-anchor="end" class="dg-axis-label">x</text><text x="40" y="54" text-anchor="end" class="dg-axis-label">y</text><polygon points="50,290 351,290 351,250 308,210 50,130" class="dg-fill-accent"></polygon><line x1="136" y1="50" x2="394" y2="290" class="dg-curve-faint"></line><line x1="50" y1="130" x2="480" y2="263.3333333333333" class="dg-curve-faint"></line><line x1="351" y1="290" x2="351" y2="50" class="dg-curve-faint"></line><text x="191.3" y="94" class="dg-edge-label">r1</text><text x="476" y="255.33333333333331" text-anchor="end" class="dg-edge-label">r2</text><text x="357" y="66" class="dg-edge-label">r3 slack</text><line x1="50" y1="50" x2="437" y2="290" class="dg-marker"></line><text x="75.8" y="54" class="dg-marker-label">2x + 3y = 9</text><polygon points="308,210 384.1474207689607,139.1651899823621 343.08233372654826,112.09581285614443" class="dg-fill-warn"></polygon><line x1="308" y1="210" x2="362.1818186240682" y2="159.59830825668075" class="dg-edge" marker-end="url(#dual-arrow)"></line><line x1="308" y1="210" x2="332.96242976696703" y2="140.3374053014874" class="dg-edge" marker-end="url(#dual-arrow)"></line><line x1="308" y1="210" x2="361.5917426113768" y2="135.22082426319514" class="dg-curve" marker-end="url(#dual-arrow)"></line><text x="368.1818186240682" y="169.59830825668075" class="dg-edge-label">a1</text><text x="324.96242976696703" y="138.3374053014874" text-anchor="end" class="dg-edge-label">a2</text><text x="367.5917426113768" y="135.22082426319514" class="dg-node-label">c</text><circle cx="308" cy="210" r="5.5" class="dg-bar"></circle><text x="298" y="228" text-anchor="end" class="dg-node-label">x* = (3, 1)</text><rect x="498" y="60" width="252" height="196" rx="9" class="dg-box"></rect><text x="512" y="84" class="dg-box-title">The certificate</text><text x="512" y="108" class="dg-box-sub">primal   c·x* = 2(3) + 3(1) = 9</text><text x="512" y="128" class="dg-box-sub">dual   b·y* = 4(1.5) + 6(0.5) + 3.5(0)</text><text x="512" y="146" class="dg-box-sub">         = 9</text><text x="512" y="172" class="dg-box-sub" style="fill:var(--color-accent)">c = 1.5 a1 + 0.5 a2</text><text x="512" y="190" class="dg-box-sub">the coefficients are the prices</text><text x="512" y="216" class="dg-box-sub">r3 slack, so y3 = 0:</text><text x="512" y="234" class="dg-box-sub">complementary slackness</text><text x="380" y="318" text-anchor="middle" class="dg-note">The optimum is a vertex where c falls in the cone of the binding normals. The weights of that combination are the shadow prices.</text></svg>
