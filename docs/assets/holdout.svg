<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" class="fig-svg wide" viewBox="0 0 760 320" role="img" aria-label="The authoring protocol, with the contaminating shortcuts struck out"><style>svg { --color-bg: #f6f8fa; --color-surface: #ffffff; --color-surface-2: #f0f3f6; --color-border: #d0d7de; --color-fg: #1f2328; --color-fg-subtle: #57606a; --color-fg-faint: #6e7781; --color-accent: #0969da; --color-accent-fg: #ffffff; --color-accent-soft: #ddf4ff; --color-accent-2: #0a7c8a; --color-magenta: #bf3989; --color-good: #1a7f37; --color-warn: #9a6700; --color-bad: #cf222e; --color-shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 10px rgba(31, 35, 40, 0.04); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-family: var(--font-sans); }
@media (prefers-color-scheme: dark) { svg { --color-bg: #0d1117; --color-surface: #161b22; --color-surface-2: #1c2230; --color-border: #30363d; --color-fg: #c9d1d9; --color-fg-subtle: #9aa6b2; --color-fg-faint: #6c7785; --color-accent: #58a6ff; --color-accent-fg: #0d1117; --color-accent-soft: #132036; --color-accent-2: #3fb1c8; --color-magenta: #f778ba; --color-good: #3fb950; --color-warn: #d29922; --color-bad: #f85149; --color-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.45); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; } }
.dg-axis { stroke: var(--color-fg-faint); stroke-width: 1.3; }
.dg-axis-label { fill: var(--color-fg-subtle); font: 12px var(--font-sans); }
.dg-tick { fill: var(--color-fg-faint); font: 11px var(--font-mono); }
.dg-grid { stroke: var(--color-border); stroke-width: 0.5; opacity: 0.6; }
.dg-curve { fill: none; stroke: var(--color-accent); stroke-width: 2.2; stroke-linejoin: round; }
.dg-curve-2 { fill: none; stroke: var(--color-magenta); stroke-width: 2; }
.dg-curve-faint { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.4; stroke-dasharray: 4 3; }
.dg-asymptote { stroke: var(--color-bad); stroke-width: 1.4; stroke-dasharray: 4 4; }
.dg-marker { stroke: var(--color-warn); stroke-width: 1.2; stroke-dasharray: 3 3; }
.dg-marker-label { fill: var(--color-warn); font: 600 11px var(--font-mono); }
.dg-note { fill: var(--color-fg-faint); font: italic 11px var(--font-sans); }
.dg-fill-accent { fill: color-mix(in oklab, var(--color-accent) 16%, transparent); stroke: var(--color-accent); stroke-width: 1; }
.dg-fill-warn { fill: color-mix(in oklab, var(--color-warn) 16%, transparent); stroke: var(--color-warn); stroke-width: 1; }
.dg-box { fill: var(--color-surface); stroke: var(--color-border); stroke-width: 1.3; }
.dg-box.accent { stroke: var(--color-accent); fill: var(--color-accent-soft); }
.dg-box.good { stroke: var(--color-good); }
.dg-box-title { fill: var(--color-fg); font: 650 12px var(--font-sans); }
.dg-box-title.accent { fill: var(--color-accent); }
.dg-box-sub { fill: var(--color-fg-subtle); font: 10.5px var(--font-mono); }
.dg-node { fill: var(--color-surface); stroke: var(--color-accent); stroke-width: 1.4; }
.dg-node-label { fill: var(--color-fg); font: 600 12px var(--font-mono); }
.dg-edge { stroke: var(--color-fg-faint); stroke-width: 1.4; fill: none; }
.dg-edge-label { fill: var(--color-fg-subtle); font: 11px var(--font-mono); }
.dg-arrowhead { fill: var(--color-fg-faint); }
.dg-bar { fill: var(--color-accent); }
.dg-bar-2 { fill: var(--color-magenta); }
.dg-bar-label { fill: var(--color-fg-subtle); font: 11px var(--font-sans); }</style><defs><marker id="hold-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"></path></marker></defs><text x="16" y="20" class="dg-axis-label">mandatory order</text><g><rect x="16" y="30" width="420" height="38" rx="7" class="dg-box accent"></rect><text x="30" y="47" class="dg-box-title accent">1. Author the statement</text><text x="30" y="62" class="dg-box-sub">prose, with its chosen trap</text><line x1="226" y1="70" x2="226" y2="76" class="dg-edge" marker-end="url(#hold-arrow)"></line></g><g><rect x="16" y="78" width="420" height="38" rx="7" class="dg-box accent"></rect><text x="30" y="95" class="dg-box-title accent">2. Author the reference</text><text x="30" y="110" class="dg-box-sub">having seen no answer at all</text><line x1="226" y1="118" x2="226" y2="124" class="dg-edge" marker-end="url(#hold-arrow)"></line></g><g><rect x="16" y="126" width="420" height="38" rx="7" class="dg-box accent"></rect><text x="30" y="143" class="dg-box-title accent">3. Bake and verify</text><text x="30" y="158" class="dg-box-sub">solve, check the optimum, run properties</text><line x1="226" y1="166" x2="226" y2="172" class="dg-edge" marker-end="url(#hold-arrow)"></line></g><g><rect x="16" y="174" width="420" height="38" rx="7" class="dg-box good"></rect><text x="30" y="191" class="dg-box-title accent">4. Freeze</text><text x="30" y="206" class="dg-box-sub">commit; after this it is not edited</text><line x1="226" y1="214" x2="226" y2="220" class="dg-edge" marker-end="url(#hold-arrow)"></line></g><g><rect x="16" y="222" width="420" height="38" rx="7" class="dg-box accent"></rect><text x="30" y="239" class="dg-box-title accent">5. Ask the models</text><text x="30" y="254" class="dg-box-sub">same prompt, n repeats</text></g><path d="M 440 200 C 530 200 530 90 442 84" class="dg-asymptote" fill="none"></path><text x="470" y="142" class="dg-box-sub" style="fill:var(--color-bad)">edit the reference</text><text x="470" y="158" class="dg-box-sub" style="fill:var(--color-bad)">after reading an answer</text><line x1="452" y1="126" x2="556" y2="172" class="dg-asymptote"></line><line x1="452" y1="172" x2="556" y2="126" class="dg-asymptote"></line><path d="M 440 250 C 680 250 680 60 444 58" class="dg-asymptote" fill="none"></path><text x="594" y="228" class="dg-box-sub" style="fill:var(--color-bad)">tune the prompt</text><text x="594" y="244" class="dg-box-sub" style="fill:var(--color-bad)">against these cases</text><line x1="588" y1="214" x2="700" y2="258" class="dg-asymptote"></line><line x1="588" y1="258" x2="700" y2="214" class="dg-asymptote"></line><text x="380" y="294" text-anchor="middle" class="dg-note">Either struck-out edge turns the measurement into the author&#x27;s agreement with the model.</text><text x="380" y="312" text-anchor="middle" class="dg-note">All twenty references were frozen before the first call, and the git record shows it.</text></svg>
