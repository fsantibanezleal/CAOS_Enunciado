<svg xmlns="http://www.w3.org/2000/svg" width="700" height="190" class="fig-svg wide" viewBox="0 0 700 190" role="img" aria-label="Two passes over the identical corpus"><style>svg { --color-bg: #f6f8fa; --color-surface: #ffffff; --color-surface-2: #f0f3f6; --color-border: #d0d7de; --color-fg: #1f2328; --color-fg-subtle: #57606a; --color-fg-faint: #6e7781; --color-accent: #0969da; --color-accent-fg: #ffffff; --color-accent-soft: #ddf4ff; --color-accent-2: #0a7c8a; --color-magenta: #bf3989; --color-good: #1a7f37; --color-warn: #9a6700; --color-bad: #cf222e; --color-shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 10px rgba(31, 35, 40, 0.04); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-family: var(--font-sans); }
@media (prefers-color-scheme: dark) { svg { --color-bg: #0d1117; --color-surface: #161b22; --color-surface-2: #1c2230; --color-border: #30363d; --color-fg: #c9d1d9; --color-fg-subtle: #9aa6b2; --color-fg-faint: #6c7785; --color-accent: #58a6ff; --color-accent-fg: #0d1117; --color-accent-soft: #132036; --color-accent-2: #3fb1c8; --color-magenta: #f778ba; --color-good: #3fb950; --color-warn: #d29922; --color-bad: #f85149; --color-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.45); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; } }
.dg-axis { stroke: var(--color-fg-faint); stroke-width: 1.3; }
.dg-axis-label { fill: var(--color-fg-subtle); font: 12px var(--font-sans); }
.dg-tick { fill: var(--color-fg-faint); font: 11px var(--font-mono); }
.dg-grid { stroke: var(--color-border); stroke-width: 0.5; opacity: 0.6; }
.dg-curve { fill: none; stroke: var(--color-accent); stroke-width: 2.2; stroke-linejoin: round; }
.dg-curve-2 { fill: none; stroke: var(--color-magenta); stroke-width: 2; }
.dg-curve-faint { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.4; stroke-dasharray: 4 3; }
.dg-asymptote { stroke: var(--color-bad); stroke-width: 1.4; stroke-dasharray: 4 4; }
.dg-marker { stroke: var(--color-warn); stroke-width: 1.2; stroke-dasharray: 3 3; }
.dg-marker-label { fill: var(--color-warn); font: 600 11px var(--font-mono); }
.dg-note { fill: var(--color-fg-faint); font: italic 11px var(--font-sans); }
.dg-fill-accent { fill: color-mix(in oklab, var(--color-accent) 16%, transparent); stroke: var(--color-accent); stroke-width: 1; }
.dg-fill-warn { fill: color-mix(in oklab, var(--color-warn) 16%, transparent); stroke: var(--color-warn); stroke-width: 1; }
.dg-box { fill: var(--color-surface); stroke: var(--color-border); stroke-width: 1.3; }
.dg-box.accent { stroke: var(--color-accent); fill: var(--color-accent-soft); }
.dg-box.good { stroke: var(--color-good); }
.dg-box-title { fill: var(--color-fg); font: 650 12px var(--font-sans); }
.dg-box-title.accent { fill: var(--color-accent); }
.dg-box-sub { fill: var(--color-fg-subtle); font: 10.5px var(--font-mono); }
.dg-node { fill: var(--color-surface); stroke: var(--color-accent); stroke-width: 1.4; }
.dg-node-label { fill: var(--color-fg); font: 600 12px var(--font-mono); }
.dg-edge { stroke: var(--color-fg-faint); stroke-width: 1.4; fill: none; }
.dg-edge-label { fill: var(--color-fg-subtle); font: 11px var(--font-mono); }
.dg-arrowhead { fill: var(--color-fg-faint); }
.dg-bar { fill: var(--color-accent); }
.dg-bar-2 { fill: var(--color-magenta); }
.dg-bar-label { fill: var(--color-fg-subtle); font: 11px var(--font-sans); }</style><g><line x1="120" x2="120" y1="26" y2="124" class="dg-grid"></line><text x="120" y="142" text-anchor="middle" class="dg-tick">0.00</text></g><g><line x1="245" x2="245" y1="26" y2="124" class="dg-grid"></line><text x="245" y="142" text-anchor="middle" class="dg-tick">0.25</text></g><g><line x1="370" x2="370" y1="26" y2="124" class="dg-grid"></line><text x="370" y="142" text-anchor="middle" class="dg-tick">0.50</text></g><g><line x1="495" x2="495" y1="26" y2="124" class="dg-grid"></line><text x="495" y="142" text-anchor="middle" class="dg-tick">0.75</text></g><g><line x1="620" x2="620" y1="26" y2="124" class="dg-grid"></line><text x="620" y="142" text-anchor="middle" class="dg-tick">1.00</text></g><g><text x="110" y="56" text-anchor="end" class="dg-axis-label">pass 1</text><line x1="210" x2="405" y1="52" y2="52" class="dg-curve"></line><line x1="210" x2="210" y1="46" y2="58" class="dg-curve"></line><line x1="405" x2="405" y1="46" y2="58" class="dg-curve"></line><circle cx="295" cy="52" r="5" class="dg-bar"></circle><text x="295" y="40" text-anchor="middle" class="dg-edge-label">0.350</text></g><g><text x="110" y="98" text-anchor="end" class="dg-axis-label">pass 2</text><line x1="175" x2="355" y1="94" y2="94" class="dg-curve"></line><line x1="175" x2="175" y1="88" y2="100" class="dg-curve"></line><line x1="355" x2="355" y1="88" y2="100" class="dg-curve"></line><circle cx="245" cy="94" r="5" class="dg-bar"></circle><text x="245" y="82" text-anchor="middle" class="dg-edge-label">0.250</text></g><rect x="210" y="40" width="145" height="62" class="dg-fill-warn" opacity="0.35"></rect><text x="282.5" y="118" text-anchor="middle" class="dg-marker-label">overlap</text><text x="350" y="166" text-anchor="middle" class="dg-note">Nothing changed between the two passes but the sampling. The difference between 0.350 and 0.250 lies inside the overlap.</text><text x="350" y="182" text-anchor="middle" class="dg-note">That is why the interval is published, not only the rate.</text></svg>
