<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" class="fig-svg wide" viewBox="0 0 760 290" role="img" aria-label="The end-to-end pipeline, statement to four verdicts"><style>svg { --color-bg: #f6f8fa; --color-surface: #ffffff; --color-surface-2: #f0f3f6; --color-border: #d0d7de; --color-fg: #1f2328; --color-fg-subtle: #57606a; --color-fg-faint: #6e7781; --color-accent: #0969da; --color-accent-fg: #ffffff; --color-accent-soft: #ddf4ff; --color-accent-2: #0a7c8a; --color-magenta: #bf3989; --color-good: #1a7f37; --color-warn: #9a6700; --color-bad: #cf222e; --color-shadow: 0 1px 2px rgba(31, 35, 40, 0.06), 0 4px 10px rgba(31, 35, 40, 0.04); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-family: var(--font-sans); }
@media (prefers-color-scheme: dark) { svg { --color-bg: #0d1117; --color-surface: #161b22; --color-surface-2: #1c2230; --color-border: #30363d; --color-fg: #c9d1d9; --color-fg-subtle: #9aa6b2; --color-fg-faint: #6c7785; --color-accent: #58a6ff; --color-accent-fg: #0d1117; --color-accent-soft: #132036; --color-accent-2: #3fb1c8; --color-magenta: #f778ba; --color-good: #3fb950; --color-warn: #d29922; --color-bad: #f85149; --color-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.45); --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; } }
.dg-axis { stroke: var(--color-fg-faint); stroke-width: 1.3; }
.dg-axis-label { fill: var(--color-fg-subtle); font: 12px var(--font-sans); }
.dg-tick { fill: var(--color-fg-faint); font: 11px var(--font-mono); }
.dg-grid { stroke: var(--color-border); stroke-width: 0.5; opacity: 0.6; }
.dg-curve { fill: none; stroke: var(--color-accent); stroke-width: 2.2; stroke-linejoin: round; }
.dg-curve-2 { fill: none; stroke: var(--color-magenta); stroke-width: 2; }
.dg-curve-faint { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.4; stroke-dasharray: 4 3; }
.dg-asymptote { stroke: var(--color-bad); stroke-width: 1.4; stroke-dasharray: 4 4; }
.dg-marker { stroke: var(--color-warn); stroke-width: 1.2; stroke-dasharray: 3 3; }
.dg-marker-label { fill: var(--color-warn); font: 600 11px var(--font-mono); }
.dg-note { fill: var(--color-fg-faint); font: italic 11px var(--font-sans); }
.dg-fill-accent { fill: color-mix(in oklab, var(--color-accent) 16%, transparent); stroke: var(--color-accent); stroke-width: 1; }
.dg-fill-warn { fill: color-mix(in oklab, var(--color-warn) 16%, transparent); stroke: var(--color-warn); stroke-width: 1; }
.dg-box { fill: var(--color-surface); stroke: var(--color-border); stroke-width: 1.3; }
.dg-box.accent { stroke: var(--color-accent); fill: var(--color-accent-soft); }
.dg-box.good { stroke: var(--color-good); }
.dg-box-title { fill: var(--color-fg); font: 650 12px var(--font-sans); }
.dg-box-title.accent { fill: var(--color-accent); }
.dg-box-sub { fill: var(--color-fg-subtle); font: 10.5px var(--font-mono); }
.dg-node { fill: var(--color-surface); stroke: var(--color-accent); stroke-width: 1.4; }
.dg-node-label { fill: var(--color-fg); font: 600 12px var(--font-mono); }
.dg-edge { stroke: var(--color-fg-faint); stroke-width: 1.4; fill: none; }
.dg-edge-label { fill: var(--color-fg-subtle); font: 11px var(--font-mono); }
.dg-arrowhead { fill: var(--color-fg-faint); }
.dg-bar { fill: var(--color-accent); }
.dg-bar-2 { fill: var(--color-magenta); }
.dg-bar-label { fill: var(--color-fg-subtle); font: 11px var(--font-sans); }</style><defs><marker id="pipe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"></path></marker></defs><g><rect x="8" y="20" width="162" height="54" rx="8" class="dg-box"></rect><text x="89" y="42" text-anchor="middle" class="dg-box-title">Statement</text><text x="89" y="60" text-anchor="middle" class="dg-box-sub">free text</text><line x1="172" y1="47" x2="194" y2="47" class="dg-edge" marker-end="url(#pipe-arrow)"></line></g><g><rect x="198" y="20" width="162" height="54" rx="8" class="dg-box accent"></rect><text x="279" y="42" text-anchor="middle" class="dg-box-title accent">Typed document</text><text x="279" y="60" text-anchor="middle" class="dg-box-sub">planteo.Problem</text><line x1="362" y1="47" x2="384" y2="47" class="dg-edge" marker-end="url(#pipe-arrow)"></line></g><g><rect x="388" y="20" width="162" height="54" rx="8" class="dg-box"></rect><text x="469" y="42" text-anchor="middle" class="dg-box-title">Emitted model</text><text x="469" y="60" text-anchor="middle" class="dg-box-sub">Pyomo / LP</text><line x1="552" y1="47" x2="574" y2="47" class="dg-edge" marker-end="url(#pipe-arrow)"></line></g><g><rect x="578" y="20" width="162" height="54" rx="8" class="dg-box"></rect><text x="659" y="42" text-anchor="middle" class="dg-box-title">Solution</text><text x="659" y="60" text-anchor="middle" class="dg-box-sub">HiGHS</text></g><rect x="198" y="112" width="162" height="46" rx="8" class="dg-box good"></rect><text x="279" y="132" text-anchor="middle" class="dg-box-title">Reference</text><text x="279" y="148" text-anchor="middle" class="dg-box-sub">authored by hand</text><line x1="279" y1="110" x2="279" y2="78" class="dg-edge" marker-end="url(#pipe-arrow)"></line><g><rect x="8" y="198" width="162" height="40" rx="8" class="dg-box accent" opacity="1"></rect><text x="89" y="223" text-anchor="middle" class="dg-box-sub">executable</text></g><g><rect x="198" y="198" width="162" height="40" rx="8" class="dg-box accent" opacity="1"></rect><text x="279" y="223" text-anchor="middle" class="dg-box-sub">structural</text></g><g><rect x="388" y="198" width="162" height="40" rx="8" class="dg-box accent" opacity="1"></rect><text x="469" y="223" text-anchor="middle" class="dg-box-sub">property</text></g><g><rect x="578" y="198" width="162" height="40" rx="8" class="dg-box" opacity="0.7"></rect><text x="659" y="223" text-anchor="middle" class="dg-box-sub">judge (labelled)</text></g><line x1="380" y1="162" x2="380" y2="194" class="dg-edge" marker-end="url(#pipe-arrow)"></line><text x="392" y="182" class="dg-edge-label">compared</text><text x="380" y="262" text-anchor="middle" class="dg-note">The four verdicts are reported separately. They are never averaged into one number.</text><text x="380" y="280" text-anchor="middle" class="dg-note">The distance between the first and the next two IS the measurement.</text></svg>
